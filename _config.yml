# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
encoding                 : utf-8
url                      : "https://liuning0820.github.io" # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
email                    : liuning0820@outlook.com
theme                    : jekyll-theme-hacker
search                   : true # true, false (default), enables basic site search powered by Lunr
repository               : liuning0820/liuning0820.github.io
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - Dockerfile.mdspell
  - Jenkinsfile

# #摘要显示分割线
excerpt_separator: <! --more-- >

# Pagination Settings (jekyll-paginate-v2)
pagination:
  enabled: true
  per_page: 5          # amount of posts to show per page
  permalink: /page:num/
  title: ':title'
  sort_field: 'date'
  sort_reverse: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-sitemap
  # - jekyll-remote-theme

# theme: jekyll-theme-hacker

# remote_theme: pages-themes/hacker@v0.2.0




# Comment 这是disqus的评论系统
comment:
    disqus: liuning0820


# Collections
# https://jekyllrb.com/docs/collections/

# collections:
#     - en-us
    
collections:
  en-us:
    output: true
    permalink: /:collection/:path/
    
# 中文集
  zh-cn:
    output: true
    permalink: /zh-cn/:path/
  