---
layout: default
title: Work For Free
---

<div class="gh-feed">
  <!-- Show the most recent posts. Uses site.posts directly so the home
       page never depends on a pagination plugin that can leave the
       paginator object nil. -->
  {% for post in site.posts limit: 5 %}
  <article class="gh-post">
    <header class="gh-post-header">
      <h2 class="gh-post-title"><a href="{{ post.url }}">{{ post.title }}</a></h2>
      <div class="gh-post-meta">
        <span class="gh-post-date">{{ post.date | date_to_string }}</span>
      </div>
    </header>

    <section class="gh-post-excerpt">
      {{ post.excerpt }}
      <a class="gh-read-more" href="{{ post.url }}">Continue reading &rarr;</a>
    </section>
  </article>
  {% endfor %}

  <!-- Link to the full archive -->
  <nav class="gh-pagination">
    <a class="gh-pagination-item" href="{{ '/all.html' | relative_url }}" title="All posts">All posts &rarr;</a>
  </nav>
</div>
